name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - run: go test ./...
      - run: go vet ./...
      - run: node --test scripts/counts-browser.test.cjs scripts/stats-browser.test.cjs scripts/theme-browser.test.cjs
      - run: python -m unittest discover -s scripts -p test_*.py
