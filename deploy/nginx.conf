worker_processes 1;
pid /tmp/blog-nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/blog-client-body;
    proxy_temp_path /tmp/blog-proxy;
    fastcgi_temp_path /tmp/blog-fastcgi;
    uwsgi_temp_path /tmp/blog-uwsgi;
    scgi_temp_path /tmp/blog-scgi;

    limit_req_zone $binary_remote_addr zone=blog_events:10m rate=10r/s;
    map $uri $blog_redirect {
        default "";
        include /etc/blog/redirects.conf;
    }

    server {
        listen 8080;
        server_name _;
        root /srv/blog/current/public;
        index index.html;
        absolute_redirect off;
        add_header Cache-Control "no-cache";

        if ($blog_redirect != "") {
            return 301 $blog_redirect$is_args$args;
        }

        error_page 404 =404 /__blogo_404.html;
        location = /__blogo_404.html {
            internal;
            alias /srv/blog/current/public/404/index.html;
        }
        location = /404/ { return 404; }
        location = /index.html { return 301 /$is_args$args; }

        location = /api/events {
            client_max_body_size 2k;
            limit_req zone=blog_events burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8787;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Referer $http_referer;
            proxy_set_header X-Forwarded-For "";
        }
        location = /data/stats.json {
            alias /srv/blog-stats-public/stats.json;
            add_header Cache-Control "no-cache" always;
        }
        location ^~ /api/ { return 404; }
        location ^~ /data/ { return 404; }
        location ~ (^|/)\. { return 404; }

        location ~ '\.[0-9a-f]{16}\.(css|js)$' {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ~ ^(?<blog_canonical>/.*/)index\.html$ {
            if (-f $request_filename) {
                return 301 $blog_canonical$is_args$args;
            }
            try_files $uri =404;
        }
        location ~ ^(?<blog_without_slash>/.*[^/])$ {
            if (-f $request_filename/index.html) {
                return 301 $blog_without_slash/$is_args$args;
            }
            try_files $uri =404;
        }
        location / { try_files $uri $uri/index.html =404; }
    }
}
