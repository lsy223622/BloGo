# 后台运行设置；展示内容在 content/site.yaml。
server:
  listen_addr: 127.0.0.1:25646
  base_url: http://127.0.0.1:25646
  trusted_proxies:
    - 127.0.0.1
    - "::1"
timezone: Asia/Shanghai
build:
  scan_interval: 60s
  keep_releases: 3
  strict_links: false
stats:
  enabled: true
  report_interval: 5m
  details:
    enabled: false
    retention: 168h
